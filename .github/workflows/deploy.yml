name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The checkout and the node setup exist only for the Capacity Gate below.
      # The deploy itself runs over SSH and needs neither.
      #
      # The gate lives in cuatro-portfolio, the estate's Anchor, and is read
      # from its `main` because that is the published gate. `sparse-checkout:
      # ops` fetches only the directory the checker and its file are in, and
      # the checker resolves `capacity-gate.yml` beside itself, so no working
      # directory is set.
      - uses: actions/checkout@v7
        with:
          repository: LuigiEspinosa/cuatro-portfolio
          ref: main
          path: cuatro-portfolio
          sparse-checkout: ops

      # `package-manager-cache: false` because this job installs no
      # dependencies: the checker has none, deliberately.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # The Capacity Gate (AD-9) runs before the deploy rather than after,
      # because a check that reports on a placement already made is a record and
      # not a gate. It is blocking and carries no `continue-on-error` and no skip
      # condition: there is one environment and no staging, so nothing downstream
      # will catch what this lets through (AD-21).
      #
      # `list-wheel` is this application's id in the Cuatro Registry. On the
      # first run it is a new id, admitted only while the gate is open; once
      # cuatro-portfolio's `ops/capacity-gate.yml` lists it in `placements`, it
      # passes as an incumbent whatever the gate's status.
      - name: Capacity Gate
        run: node cuatro-portfolio/ops/capacity-gate.mjs list-wheel

      # The host is whatever SERVER_HOST resolves to. This workflow cannot verify
      # which provider that is, so it does not name one.
      #
      # `--remove-orphans` so a service renamed or removed in a later compose
      # file does not survive on the box as an orphan no deploy touches again.
      #
      # `reset --hard` rather than `pull`: a pull fails or merges if the box
      # checkout has drifted, and a deploy that half-applies is worse than one
      # that refuses.
      #
      # The build runs on the box. That is a knowing breach of the estate's
      # AD-8, recorded as KV-1 in cuatro-portfolio's ops/known-violations.md and
      # retired by Story 4.3, chosen over a registry image on 2026-09-13 so this
      # deploy mirrors the Anchor's rather than opening a second shape.
      - name: Deploy over SSH to SERVER_HOST
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ~/list-wheel
            git fetch origin main
            git reset --hard origin/main
            docker compose up --build -d --remove-orphans
