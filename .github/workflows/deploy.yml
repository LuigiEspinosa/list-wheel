name: Deploy

on:
  push:
    branches: [main]
    # A push that changes only Markdown ships nothing: `.dockerignore` keeps every `*.md` out of the
    # image, and neither the build nor either suite reads Markdown. Without this such a push still
    # compiled on the two-core box (KV-1) for no change (DW-93).
    paths-ignore:
      - '**.md'
  # A redeploy without a commit, after a box-side change. It deploys `main` only: the deploy job's
  # first step refuses any other ref, and the box refuses a commit that is not on `main` (DW-93).
  workflow_dispatch:

# The token reads the checkout and nothing else, and a job widens only what it needs (DW-87). This
# repository's own default is already `read`; the block says so where the workflow is read, rather
# than leaving it to a setting nothing in the repository shows.
permissions:
  contents: read

# One deploy at a time. A push that lands while a deploy runs waits for it rather than cancelling it,
# since a compose `up` cut off halfway is worse than one that finishes; a third push replaces the one
# waiting, and each run deploys its own sha, so the box ends on the newest (DW-93).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The suite runs before every deploy and `deploy` needs this job, so a red suite stops the deploy
  # before anything reaches the box (DW-90). `main` is unprotected, so that `needs:` is the gate; no
  # required check stands behind it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # `karma.conf.js` runs the suite once in `ChromeHeadlessNoSandbox`, on the Google Chrome the
      # runner image carries.
      - run: npm test
      # The deploy script and this file's wiring, which Karma, running in a browser, cannot reach.
      - run: node --test ops/deploy-remote.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # `workflow_dispatch` runs on whatever ref it is given. This fails the run for any ref but
      # `main` before anything reaches the box, and the `report` job below then records it.
      - name: Refuse any ref but main
        run: test "$GITHUB_REF" = refs/heads/main

      # The checkout and the node setup exist only for the Capacity Gate below.
      # The deploy itself runs over SSH and needs neither.
      #
      # The gate lives in cuatro-portfolio, the estate's Anchor, and is read
      # from its `main` because that is the published gate. `sparse-checkout:
      # ops` fetches only the directory the checker and its file are in, and
      # the checker resolves `capacity-gate.yml` beside itself, so no working
      # directory is set.
      - uses: actions/checkout@v7
        with:
          repository: LuigiEspinosa/cuatro-portfolio
          ref: main
          path: cuatro-portfolio
          sparse-checkout: ops

      # `package-manager-cache: false` because this job installs no
      # dependencies: the checker has none, deliberately.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # The Capacity Gate (AD-9) runs before the deploy rather than after,
      # because a check that reports on a placement already made is a record and
      # not a gate. It is blocking and carries no `continue-on-error` and no skip
      # condition: there is one environment and no staging, so nothing downstream
      # will catch what this lets through (AD-21).
      #
      # `list-wheel` is this application's id in the Cuatro Registry. On the
      # first run it is a new id, admitted only while the gate is open; once
      # cuatro-portfolio's `ops/capacity-gate.yml` lists it in `placements`, it
      # passes as an incumbent whatever the gate's status.
      - name: Capacity Gate
        run: node cuatro-portfolio/ops/capacity-gate.mjs list-wheel

      # The host is whatever SERVER_HOST resolves to. This workflow cannot verify
      # which provider that is, so it does not name one.
      #
      # The deploy itself is `ops/deploy-remote.sh` (DW-94), the same shape as cuatro-portfolio's. This
      # step sends the box one command string, and the box runs it one of two ways. While the key is
      # unrestricted the login shell runs it: it fetches `main`, reads the script out of the commit being
      # deployed and runs it with that sha, which is how the first deploy after the script lands brings
      # it onto the box. Once the key's `authorized_keys` line forces the script (Pending Operator action
      # 9 of cuatro-portfolio's `ops/contract-serving.md`), sshd runs the checkout's copy instead and
      # hands it this string, of which it reads the last word alone. So the sha stays the last word.
      # `${{ github.sha }}` is the pushed commit, or `main`'s head on a dispatch, which is the commit
      # the test job and the gate above checked; the script resets to it, not to whatever `origin/main`
      # is by then (DW-93). `ops/deploy-remote.test.mjs` runs this exact string both ways against a
      # scratch repository.
      - name: Deploy over SSH to SERVER_HOST
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: >-
            cd ~/list-wheel &&
            git fetch origin main &&
            s="$(git show ${{ github.sha }}:ops/deploy-remote.sh)" &&
            exec /bin/bash -c "$s" deploy-remote ${{ github.sha }}

  # DW-20: a failed deploy used to reach nobody. When either job above fails (a red suite, the ref
  # refusal, the gate or the deploy itself), this opens an issue, which reaches the Operator through the
  # repository's watch notifications. cuatro-portfolio reports from its deploy job's last step; here it
  # is a job of its own, because a red suite skips the deploy job whole and a step inside it would never
  # run. It is the only job holding a write scope, and it runs no code but `gh`. A deploy that never
  # runs opens nothing.
  report:
    needs: [test, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failed deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Deploy failed at ${GITHUB_SHA:0:7}" \
            --body "Deploy run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed: $GITHUB_EVENT_NAME on $GITHUB_REF at $GITHUB_SHA, started by $GITHUB_ACTOR. The run's log names the job and the step; when it is the test job, the suite stopped the deploy and the box was not touched. Close this issue with the cause once it is fixed."
